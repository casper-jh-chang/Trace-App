version: '3'
services:
  app:
    build: 
      context: .
      args:
        - VITE_GEMINI_API_KEY=${VITE_GEMINI_API_KEY}
        - VITE_DASHSCOPE_API_KEY=${VITE_DASHSCOPE_API_KEY}
    # 仅在内部网络暴露端口，通过 Nginx 转发
    expose:
      - "3001"
    volumes:
      - ./data:/app/data
    restart: always
    environment:
      - PORT=3001
      - DB_FILE=/app/data/drawer.db
      # - GOOGLE_API_KEY=your_key_here

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: always
