<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>抽屉 - 智能收纳</title>
    <link rel="icon" type="image/png" href="/icon.PNG">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#03BFB5',
                        secondary: '#4ED2CB',
                        light: '#EFF5F9',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --color-primary: #03BFB5;
            --color-secondary: #4ED2CB;
            --color-light: #EFF5F9;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #1a1a1a;
            color: #000000;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* iPhone frame wrapper */
        .iphone-frame {
            width: 375px;
            height: 812px;
            min-width: 375px;
            min-height: 812px;
            max-width: calc(100vw - 40px);
            max-height: calc(100vh - 40px);
            aspect-ratio: 375 / 812;
            background: #000;
            border-radius: 40px;
            padding: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(255, 255, 255, 0.1) inset;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        .iphone-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
            height: 30px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 10;
        }

        .iphone-screen {
            width: 100%;
            height: 100%;
            background-color: #EFF5F9;
            border-radius: 32px;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
        }

        #root {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
        }

        /* Responsive: on mobile, remove frame */
        @media (max-width: 420px) {
            body {
                background-color: #EFF5F9;
                padding: 0;
            }
            .iphone-frame {
                width: 100%;
                height: 100%;
                border-radius: 0;
                padding: 0;
                box-shadow: none;
            }
            .iphone-frame::before {
                display: none;
            }
            .iphone-screen {
                border-radius: 0;
            }
        }

        /* iPhone safe area support - apply to root content */
        @supports (padding: max(0px)) {
            #root {
                padding-top: max(env(safe-area-inset-top), 0px);
                padding-bottom: max(env(safe-area-inset-bottom), 0px);
                padding-left: max(env(safe-area-inset-left), 0px);
                padding-right: max(env(safe-area-inset-right), 0px);
            }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Native Apple-like blurred background */
        .glass-header {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
        }

        .glass-nav {
            background-color: rgba(249, 249, 249, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            border-top: 0.5px solid rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="iphone-frame">
        <div class="iphone-screen">
            <div id="root"></div>
        </div>
    </div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
